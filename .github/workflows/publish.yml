name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    # Only publish when a release commit lands on main (e.g. a merged
    # "chore: release v0.2.0" PR) or when triggered manually.
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore: release') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm OIDC trusted publishing
    outputs:
      published: ${{ steps.publish.outcome == 'success' }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          registry-url: "https://registry.npmjs.org"
          # No dependency cache here: a cache written by another workflow run must not be able to
          # feed into the job that holds the publishing credentials.
      # Re-running the workflow (or a non-bumping "chore: release" commit) must not try to
      # republish an existing version, which npm rejects anyway.
      - name: Check whether this version is already on npm
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version is already on npm; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      # The pinned Node ships npm >= 11.5.1, which is required for OIDC trusted publishing.
      - if: steps.version.outputs.exists == 'false'
        run: pnpm install --frozen-lockfile
      # No token needed: npm authenticates via the workflow's OIDC identity,
      # which must be registered as a Trusted Publisher on the npm package.
      # `npm publish` runs the prepublishOnly check (lint + format + build + test) first.
      - id: publish
        if: steps.version.outputs.exists == 'false'
        run: npm publish --access public

  release:
    # Tag and release in a separate job so the job holding id-token: write never has
    # write access to the repository contents.
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create git tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
