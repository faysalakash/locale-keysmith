name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    # Only publish when a release commit lands on main (e.g. a merged
    # "chore: release v0.2.0" PR) or when triggered manually.
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore: release') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm OIDC trusted publishing
    outputs:
      published: ${{ steps.publish.outcome == 'success' }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .tool-versions
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      # Re-running the workflow (or a non-bumping "chore: release" commit) must not try to
      # republish an existing version, which npm rejects anyway.
      - name: Check whether this version is already on npm
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version is already on npm; skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      # The pinned Node ships npm >= 11.5.1, which is required for OIDC trusted publishing.
      - if: steps.version.outputs.exists == 'false'
        run: pnpm install --frozen-lockfile
      # No token needed: npm authenticates via the workflow's OIDC identity,
      # which must be registered as a Trusted Publisher on the npm package.
      # `npm publish` runs the prepublishOnly check (lint + format + build + test) first.
      - id: publish
        if: steps.version.outputs.exists == 'false'
        run: npm publish --access public

  release:
    # Tag and release in a separate job so the job holding id-token: write never has
    # write access to the repository contents.
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create git tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
