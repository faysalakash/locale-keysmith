name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    # Only publish when a release commit lands on main (e.g. a merged
    # "chore: release v0.2.0" PR) or when triggered manually.
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore: release') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `npm publish` runs the `prepublishOnly` check (lint + format + build + test)
      # before publishing, so the release is gated on a green build.
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
