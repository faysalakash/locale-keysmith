name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported version (engines.node), then each supported major up to the
        # pinned dev version in .tool-versions.
        node: ["22.12.0", "22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test
      # Install the packed tarball with npm and run it through npx, exactly like a user would.
      # This catches packaging problems (missing shebang, bad bin path, wrong files list).
      - name: Smoke-test the packed CLI via npx
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          npm init -y > /dev/null
          npm install ./locale-keysmith-*.tgz
          npx locale-keysmith --version

  # The single check the "Protect Main" ruleset requires. Its name stays `vitest` however the
  # Node matrix changes. `always()` makes it report failure (not "skipped", which counts as
  # passing) when any matrix job fails or is cancelled.
  vitest:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Node version to pass
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
