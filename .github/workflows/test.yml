name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported version (engines.node), current LTS line, and the pinned dev version.
        node: ["22.12.0", "22", "24"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test
      # Install the packed tarball with npm and run it through npx, exactly like a user would.
      # This catches packaging problems (missing shebang, bad bin path, wrong files list).
      - name: Smoke-test the packed CLI via npx
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          npm init -y > /dev/null
          npm install ./locale-keysmith-*.tgz
          npx locale-keysmith --version

  # The single check the "Protect Main" ruleset requires. Its name stays `vitest` however the
  # Node matrix changes. `always()` makes it report failure (not "skipped", which counts as
  # passing) when any matrix job fails or is cancelled.
  vitest:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Node version to pass
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
